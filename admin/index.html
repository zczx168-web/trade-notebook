<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易纠错本 · 会员开通工具</title><link rel="stylesheet" href="admin.css"><script defer src="icons.js"></script><script defer src="admin.js"></script></head>
<body><main>
  <header><div class="admin-brand"><i data-lucide="key-round"></i><div><h1>会员开通工具</h1><p>交易纠错本</p></div></div><span class="local-badge">仅本机</span></header>
  <section class="issue-section"><h2>核账后签发</h2><form id="issueForm">
    <label class="wide">客户设备编号<input id="device" required pattern="TN-[A-Fa-f0-9]{32}" maxlength="35" placeholder="TN- 开头的完整设备编号" autocomplete="off"></label>
    <label>会员类型<select id="plan"><option value="month">月度会员 · ¥19.90 · 30 天</option><option value="forever">永久会员 · ¥199</option></select></label>
    <label>微信交易单号<input id="reference" required pattern="[A-Za-z0-9._-]{6,100}" minlength="6" maxlength="100" autocomplete="off"></label>
    <label class="confirmation wide"><input id="confirmed" type="checkbox" required>已核实到账金额、客户设备编号和会员类型</label>
    <div class="wide action-row"><p id="error" role="alert"></p><button id="issueButton" class="primary" type="submit"><i data-lucide="badge-check"></i>生成激活码</button></div>
  </form></section>
  <section id="result" hidden><div class="section-head"><h2>已签发激活码</h2><span id="issuedStatus"></span></div><dl id="summary"></dl><label>客户激活码<textarea id="token" readonly rows="5" spellcheck="false"></textarea></label><div class="result-actions"><button id="copyMessage" class="primary"><i data-lucide="copy"></i>复制给客户的开通信息</button><button id="downloadLicense" class="secondary"><i data-lucide="download"></i>下载激活文件</button></div><p id="copyStatus" role="status"></p></section>
  <section><div class="section-head"><h2>签发记录</h2><button id="refresh" class="icon-button" title="刷新记录" aria-label="刷新记录"><i data-lucide="refresh-cw"></i></button></div><div class="table-scroll"><table><thead><tr><th>签发时间</th><th>设备编号</th><th>会员</th><th>微信交易单号</th><th>到期时间</th><th></th></tr></thead><tbody id="history"></tbody></table></div></section>
  <footer>月卡从签发时起算；续费顺延 30 天。同一微信交易单号重复提交不会重复续期。</footer>
</main></body></html>
